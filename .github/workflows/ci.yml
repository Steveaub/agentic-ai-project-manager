name: Validate capstone
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check pm tests tools evaluations
      - run: python -m pytest -q
      - run: python tools/check_secrets.py
      - run: node --check web/app.js
      - run: npm ci
      - run: |
          python -m uvicorn pm.api:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          BROWSER_CHANNEL=chrome npm run test:e2e
          BROWSER_CHANNEL=chrome node tests/browser-requirements.cjs
          BROWSER_CHANNEL=chrome node tests/browser-presentation.cjs
          BROWSER_CHANNEL=chrome node tests/browser-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: docs/screenshots/
