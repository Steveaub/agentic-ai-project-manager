[project]
name = "agentic-ai-project-manager"
version = "0.1.0"
description = "Transparent, bounded AI-assisted project planning"
requires-python = ">=3.12"
dependencies = ["fastapi==0.161.1", "uvicorn==0.54.0", "pydantic==2.14.1", "openai==3.37.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
